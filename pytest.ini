[pytest]
testpaths = tests
python_files = test_*.py

# ---------------------------------------------------------------------------
# Public test scope
# ---------------------------------------------------------------------------
# The blocking CI job runs:
#
#     pytest -m "not requires_private_assets and not legacy_auth"
#
# Every other test in the suite is enforced. The two markers below are the only
# way a test leaves the blocking scope, each use carries a written reason at the
# point of use, and the diagnostic workflow still runs the entire suite —
# including everything marked here.
#
# A test is never marked merely because it fails. See docs/TESTING_STATUS.md.
markers =
    requires_private_assets: needs something intentionally excluded from this public repository (trained model weights, teammate-owned modules, private deployment scripts) or physical hardware such as a camera. Cannot pass here by design.
    legacy_auth: asserts the cookie-backed Google OAuth session contract that was replaced by Supabase JWT. The published module deliberately does not expose SESSION_SECRET, SessionMiddleware or the OAuth state-token helpers, so these tests describe an implementation that no longer exists. Tracked for rewrite against the JWT contract.
